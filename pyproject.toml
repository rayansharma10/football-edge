[project]
name = "fedge"
version = "0.1.0"
description = "football-edge: football match prediction and paper-betting ML system"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "penaltyblog",
    "lightgbm",
    "catboost",
    "scikit-learn",
    "duckdb",
    "pyarrow",
    "pandas",
    "polars",
    "pandera",
    "betfairlightweight",
    "flumine",
    "python-dotenv",
    "requests",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fedge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
